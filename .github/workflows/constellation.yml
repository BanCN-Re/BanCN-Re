# Redraws the contribution star chart (assets/constellation-*.svg) every day.
name: Constellation

on:
  schedule:
    - cron: "23 16 * * *"   # 00:23 in China Standard Time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/constellation.yml"]

permissions:
  contents: write

concurrency:
  group: constellation
  cancel-in-progress: true

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Chart the sky
        run: python scripts/build.py constellation --fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the new chart
        run: |
          git add assets/constellation-*.svg scripts/data/contributions.json
          if git diff --cached --quiet; then
            echo "The sky is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Chart the constellation"
          git push
